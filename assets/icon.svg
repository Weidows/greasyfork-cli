<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!--
    gf app icon.

    Geometry is chosen for legibility at 16px, not for a pretty 256px render:
    at 256 units the 20-unit tine gaps are 1.25 px at 16px, which is the
    smallest that still survives antialiasing. The black disc of Greasy Fork's
    own logo is deliberately omitted — it eats the space the tines need and
    costs contrast (white-on-red beats white-on-black-on-red when small).

    Colours are sampled from the committed assets/header.webp so the icon and
    the README art come from one palette.
  -->
  <defs>
    <linearGradient id="gfRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7F0201"/>
      <stop offset="1" stop-color="#E30E05"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#gfRed)"/>

  <g fill="#FFFFFF">
    <!-- four tines: 24 wide, 20 apart (span 156, centred) -->
    <rect x="50"  y="50"  width="24" height="70" rx="12"/>
    <rect x="94"  y="50"  width="24" height="70" rx="12"/>
    <rect x="138" y="50"  width="24" height="70" rx="12"/>
    <rect x="182" y="50"  width="24" height="70" rx="12"/>
    <!-- crossbar joins them, so they do not read as four loose pillars -->
    <rect x="50"  y="118" width="156" height="22" rx="7"/>
    <!-- handle -->
    <rect x="116" y="140" width="24" height="66" rx="12"/>
  </g>
</svg>
