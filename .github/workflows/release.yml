name: release

# One file, two jobs: build the prebuilt binaries and attach them to a GitHub
# Release, and publish the same version to npm with Trusted Publishing (OIDC) —
# no npm token anywhere.
#
# Trigger by pushing a v* tag, or manually from the Actions tab (the manual run
# asks for the version so tag and package.json cannot drift apart).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.1.1 (must equal package.json's version)"
        required: true

permissions:
  contents: write
  id-token: write # npm Trusted Publishing (OIDC)

concurrency:
  group: release-${{ github.ref }}
  # A superseded release run should be dropped, not queued behind the new one:
  # otherwise a re-pushed tag leaves the older run waiting for a runner.
  cancel-in-progress: true

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      # Guards the classic slip of tagging v0.2.0 while package.json still says
      # 0.1.0, which would ship a binary and an npm version that disagree.
      - id: v
        run: |
          set -euo pipefail
          pkg=$(node -p "require('./package.json').version")
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
            source="manual input"
          else
            version="${GITHUB_REF_NAME#v}"
            source="tag ${GITHUB_REF_NAME}"
          fi
          if [ "$version" != "$pkg" ]; then
            echo "::error::version from $source ($version) does not match package.json ($pkg)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  build:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        # `icon` is a separate column rather than a condition on the Compile step
        # because --windows-icon is a Windows-only flag: passing it to a Linux or
        # darwin build fails the job. Only the PE (Windows) format carries an
        # embedded icon anyway — a bare Mach-O or ELF binary has nowhere to put
        # one, so the other targets get an empty value.
        #
        # The path is repo-relative on purpose: the job's cwd is the checkout
        # root, and Bun treats an MSYS-style /c/... path as a *relative* one
        # (a trap already recorded in the README's binary section).
        include:
          - { target: bun-linux-x64,    runner: ubuntu-latest,  asset: gf-linux-x64,       smoke: true,  icon: '' }
          - { target: bun-linux-arm64,  runner: ubuntu-latest,  asset: gf-linux-arm64,     smoke: false, icon: '' }
          - { target: bun-windows-x64,  runner: windows-latest, asset: gf-windows-x64.exe, smoke: true,  icon: '--windows-icon=assets/icon.ico' }
          - { target: bun-darwin-x64,   runner: macos-14,       asset: gf-darwin-x64,      smoke: false, icon: '' }
          - { target: bun-darwin-arm64, runner: macos-14,       asset: gf-darwin-arm64,    smoke: true,  icon: '' }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      # Build with Node so the version stamp runs: __VERSION__ is a whole string
      # literal in dist/, and compiling straight from src/ would ship a binary
      # whose `--version` prints the literal placeholder.
      - uses: actions/setup-node@v7
        with:
          # 22, not 20: vitest 5 requires ^22.12 and warns (EBADENGINE) below that.
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      # Bun bundles dist/ into one self-contained executable and cross-compiles
      # every target, but each target still builds on its own runner so the
      # macOS code signature below stays possible.
      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned to the version the proxy tunnel was verified against locally.
          # `latest` would silently change the compiler under a released tag.
          bun-version: 1.3.14
      - name: Compile
        shell: bash
        run: |
          mkdir -p out
          bun build ./dist/cli.js --compile --minify \
            --target=${{ matrix.target }} \
            ${{ matrix.icon }} \
            --outfile "out/${{ matrix.asset }}"
          ls -l out

      # A downloaded arm64 binary is killed on sight without any signature; an
      # ad-hoc signature is enough for files fetched with curl or a browser.
      - name: Ad-hoc codesign
        if: startsWith(matrix.target, 'bun-darwin')
        run: codesign --force --sign - "out/${{ matrix.asset }}"

      # Only a binary whose architecture matches the runner can actually execute.
      # linux-arm64 and darwin-x64 are deliberately left out: running them would
      # need emulation (QEMU / Rosetta), which would then be under test as much as
      # the binary. Their compilation is still verified, and the artifact is still
      # published. `--version` is the hard check; the live search is best-effort so
      # a third-party outage or a rate-limited CI IP cannot block a release.
      - name: Smoke test
        if: matrix.smoke
        shell: bash
        run: |
          chmod +x "out/${{ matrix.asset }}" || true
          "out/${{ matrix.asset }}" --version
          "out/${{ matrix.asset }}" search bilibili -n 2 \
            || echo "::warning::live search failed (network-dependent, not fatal)"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    needs: [meta, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true

      # Archives are made here, once, on one runner, rather than per-platform in
      # the matrix: tar/zip behave the same everywhere but the shell does not, and
      # this keeps one toolchain responsible for the checksums.
      #
      # Why archives at all: each binary is ~63-98 MB because it embeds the whole
      # Bun runtime. gzip brings that down by ~2.6x, and that is the only honest
      # saving available (UPX breaks the Bun payload; minify saves 18 KB).
      - name: Package archives
        run: |
          set -euo pipefail
          cd out
          mkdir -p archives
          for f in gf-linux-x64 gf-linux-arm64 gf-darwin-x64 gf-darwin-arm64; do
            tar -czf "archives/$f.tar.gz" "$f"
          done
          if command -v zip >/dev/null 2>&1; then
            zip -q -9 archives/gf-windows-x64.zip gf-windows-x64.exe
          else
            python3 -c "import zipfile;zipfile.ZipFile('archives/gf-windows-x64.zip','w',zipfile.ZIP_DEFLATED).write('gf-windows-x64.exe')"
          fi
          rm -f gf-linux-* gf-darwin-* gf-windows-*
          cd archives
          sha256sum * > SHA256SUMS.txt
          ls -l
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: ${{ needs.meta.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: out/archives/*

  # npm: Trusted Publishing. 绑在 npm 上的身份是
  #   github · Weidows/greasyfork-cli · release.yml · allow: npm publish
  # 文件名是信任契约的一部分 —— 改名 = 立即 ENEEDAUTH。
  # 不需要 NPM_TOKEN：`id-token: write` 让 runner 换取短时发布凭证，
  # provenance 也由 OIDC 自动生成（不必写 --provenance）。
  npm:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      # trusted publishing 要 npm >= 11.5.1；别依赖镜像自带的版本
      - run: npm install -g npm@^11.15.0 && npm --version

      # 幂等：重推 tag 不该因为版本已存在而红。
      - name: Skip when this version is already on npm
        id: gate
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          if npm view "@greasyfork/cli@$VERSION" version >/dev/null 2>&1; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
            echo "::notice::@greasyfork/cli@$VERSION is already on npm — nothing to publish"
          fi

      # prepublishOnly 跑 build + test，所以这里不用单独构建。
      # 永远不要加 --ignore-scripts：那会发出 dist/ 里还带 __VERSION__ 占位的包。
      - if: steps.gate.outputs.skip != '1'
        run: npm publish
