name: release

# Builds the prebuilt binaries and attaches them to a GitHub Release.
#
# Trigger by pushing a v* tag, or manually from the Actions tab (the manual run
# asks for the version so tag and package.json cannot drift apart).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.1.1 (must equal package.json's version)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  # A superseded release run should be dropped, not queued behind the new one:
  # otherwise a re-pushed tag leaves the older run waiting for a runner.
  cancel-in-progress: true

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      # Guards the classic slip of tagging v0.2.0 while package.json still says
      # 0.1.0, which would ship a binary and an npm version that disagree.
      - id: v
        run: |
          set -euo pipefail
          pkg=$(node -p "require('./package.json').version")
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
            source="manual input"
          else
            version="${GITHUB_REF_NAME#v}"
            source="tag ${GITHUB_REF_NAME}"
          fi
          if [ "$version" != "$pkg" ]; then
            echo "::error::version from $source ($version) does not match package.json ($pkg)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  build:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: bun-linux-x64,    runner: ubuntu-latest,  asset: gf-linux-x64,       smoke: true }
          - { target: bun-linux-arm64,  runner: ubuntu-latest,  asset: gf-linux-arm64,     smoke: false }
          - { target: bun-windows-x64,  runner: windows-latest, asset: gf-windows-x64.exe, smoke: true }
          - { target: bun-darwin-x64,   runner: macos-14,       asset: gf-darwin-x64,      smoke: false }
          - { target: bun-darwin-arm64, runner: macos-14,       asset: gf-darwin-arm64,    smoke: true }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # Build with Node so the version stamp runs: __VERSION__ is a whole string
      # literal in dist/, and compiling straight from src/ would ship a binary
      # whose `--version` prints the literal placeholder.
      - uses: actions/setup-node@v4
        with:
          # 22, not 20: vitest 5 requires ^22.12 and warns (EBADENGINE) below that.
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      # Bun bundles dist/ into one self-contained executable and cross-compiles
      # every target, but each target still builds on its own runner so the
      # macOS code signature below stays possible.
      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned to the version the proxy tunnel was verified against locally.
          # `latest` would silently change the compiler under a released tag.
          bun-version: 1.3.14
      - name: Compile
        shell: bash
        run: |
          mkdir -p out
          bun build ./dist/cli.js --compile --minify \
            --target=${{ matrix.target }} \
            --outfile "out/${{ matrix.asset }}"
          ls -l out

      # A downloaded arm64 binary is killed on sight without any signature; an
      # ad-hoc signature is enough for files fetched with curl or a browser.
      - name: Ad-hoc codesign
        if: startsWith(matrix.target, 'bun-darwin')
        run: codesign --force --sign - "out/${{ matrix.asset }}"

      # Only a binary whose architecture matches the runner can actually execute.
      # linux-arm64 and darwin-x64 are deliberately left out: running them would
      # need emulation (QEMU / Rosetta), which would then be under test as much as
      # the binary. Their compilation is still verified, and the artifact is still
      # published. `--version` is the hard check; the live search is best-effort so
      # a third-party outage or a rate-limited CI IP cannot block a release.
      - name: Smoke test
        if: matrix.smoke
        shell: bash
        run: |
          chmod +x "out/${{ matrix.asset }}" || true
          "out/${{ matrix.asset }}" --version
          "out/${{ matrix.asset }}" search bilibili -n 2 \
            || echo "::warning::live search failed (network-dependent, not fatal)"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    needs: [meta, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      # Archives are made here, once, on one runner, rather than per-platform in
      # the matrix: tar/zip behave the same everywhere but the shell does not, and
      # this keeps one toolchain responsible for the checksums.
      #
      # Why archives at all: each binary is ~63-98 MB because it embeds the whole
      # Bun runtime. gzip brings that down by ~2.6x, and that is the only honest
      # saving available (UPX breaks the Bun payload; minify saves 18 KB).
      - name: Package archives
        run: |
          set -euo pipefail
          cd out
          mkdir -p archives
          for f in gf-linux-x64 gf-linux-arm64 gf-darwin-x64 gf-darwin-arm64; do
            tar -czf "archives/$f.tar.gz" "$f"
          done
          if command -v zip >/dev/null 2>&1; then
            zip -q -9 archives/gf-windows-x64.zip gf-windows-x64.exe
          else
            python3 -c "import zipfile;zipfile.ZipFile('archives/gf-windows-x64.zip','w',zipfile.ZIP_DEFLATED).write('gf-windows-x64.exe')"
          fi
          rm -f gf-linux-* gf-darwin-* gf-windows-*
          cd archives
          sha256sum * > SHA256SUMS.txt
          ls -l
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: ${{ needs.meta.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: out/archives/*
